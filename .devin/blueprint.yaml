# https://docs.devin.ai/onboard-devin/environment-yaml
# Spring Cloud microservices internet-banking platform (Java 21, Spring Boot 3.2.4).
# Build runs with Gradle wrapper (8.6); runtime is fully containerized via docker-compose.

# One-time setup (e.g., install system tools, global CLIs).
initialize: |
  if [ ! -d /usr/lib/jvm/jdk-21.0.2+13 ]; then
    curl -fsSL https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.2%2B13/OpenJDK21U-jdk_x64_linux_hotspot_21.0.2_13.tar.gz -o /tmp/jdk21.tar.gz
    sudo mkdir -p /usr/lib/jvm
    sudo tar -xzf /tmp/jdk21.tar.gz -C /usr/lib/jvm
  fi
  echo 'export JAVA_HOME=/usr/lib/jvm/jdk-21.0.2+13' >> $HOME/.bashrc
  echo 'export PATH=$JAVA_HOME/bin:$PATH' >> $HOME/.bashrc

  # --- mongo-migration `online` variant, MySQL source (board UNT5, branch mmp-rt/b1-mysql; plan step s1.1-blueprint) ---
  # Source + local-target fixture images; the fixture compose uses `pull_policy: never`, so pull them once here.
  docker pull mysql:8
  docker pull mongo:7
  # Source client for the family (`mysql` CLI; trivial reads against the local fixture only).
  if ! command -v mysql >/dev/null 2>&1; then
    export DEBIAN_FRONTEND=noninteractive
    sudo -n apt-get update
    sudo -n apt-get install -y mysql-client-8.0
  fi
  # mongosh + MongoDB Database Tools (normally present from the org blueprint; install only if missing).
  if ! command -v mongosh >/dev/null 2>&1 || ! command -v mongodump >/dev/null 2>&1; then
    export DEBIAN_FRONTEND=noninteractive
    sudo -n apt-get install -y ca-certificates curl gnupg
    curl -fsSL https://pgp.mongodb.com/server-8.0.asc | gpg --dearmor | sudo -n tee /usr/share/keyrings/mongodb-server-8.0.gpg >/dev/null
    echo "deb [ arch=amd64 signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg ] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/8.0 multiverse" | sudo -n tee /etc/apt/sources.list.d/mongodb-org-8.0.list >/dev/null
    sudo -n apt-get update
    sudo -n apt-get install -y mongodb-mongosh mongodb-database-tools
  fi
  # Atlas CLI (normally in ~/.local/bin from the org blueprint; install only if missing).
  if ! PATH="$HOME/.local/bin:$PATH" command -v atlas >/dev/null 2>&1; then
    export DEBIAN_FRONTEND=noninteractive
    sudo -n apt-get install -y mongodb-atlas-cli
  fi
  # mongo-migration plugin 0.7.0, pinned, cloned beside the repo (the plugin is not installed in this org,
  # so workers run its stdlib scripts directly and enforce the mongo_guard rules themselves).
  if [ ! -d "$HOME/repos/mongo-migration-plugin/.git" ]; then
    git clone https://github.com/Cognition-Partner-Workshops/mongo-migration-plugin "$HOME/repos/mongo-migration-plugin"
  fi
  git -C "$HOME/repos/mongo-migration-plugin" fetch -q origin
  git -C "$HOME/repos/mongo-migration-plugin" checkout -q caeb34dc6fadcae4926b54d9f8648a16d3cced79
  # Recon harness venv: the org blueprint creates /home/ubuntu/.venvs/recon with the drivers; extend, never replace.
  mkdir -p /home/ubuntu/.venvs
  if [ ! -x /home/ubuntu/.venvs/recon/bin/python ]; then /usr/bin/python3 -m venv /home/ubuntu/.venvs/recon; fi
  /home/ubuntu/.venvs/recon/bin/python -m pip install -q -U pip setuptools
  /home/ubuntu/.venvs/recon/bin/pip install -q "pymysql>=1.1" "pymongo>=4.6" "pytest>=7.0"

# Every build: compile all 7 service jars with Java 21 and build local docker images
# Install project dependencies (runs during builds, surfaced to agent at session start).
maintenance: |
  export JAVA_HOME=/usr/lib/jvm/jdk-21.0.2+13
  export PATH=$JAVA_HOME/bin:$PATH
  cd $HOME/repos/ts-java-spring-boot-internet-banking
  # Maven Central / plugins.gradle.org return HTTP 429 when many blueprints build
  # concurrently during a snapshot build, so retry each build with backoff.
  export GRADLE_OPTS="-Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000 -Dorg.gradle.internal.repository.max.retries=5 -Dorg.gradle.internal.repository.initial.backoff=2000"
  retry() {
    local n=1 max=5 delay=15
    until "$@"; do
      if [ $n -ge $max ]; then
        echo "FAILED after $max attempts: $*" >&2
        return 1
      fi
      echo "Attempt $n failed (likely upstream 429/network); retrying in ${delay}s: $*" >&2
      sleep $delay
      delay=$((delay * 2))
      n=$((n + 1))
    done
  }
  for d in internet-banking-config-server internet-banking-service-registry internet-banking-api-gateway internet-banking-user-service internet-banking-fund-transfer-service internet-banking-utility-payment-service core-banking-service; do
    chmod +x "$d/gradlew"
    retry bash -c "cd '$d' && ./gradlew bootJar -x test --no-daemon --max-workers=2"
    retry bash -c "cd '$d' && docker build -t 'javatodev/$d' ."
  done

  # --- mongo-migration `online` variant, MySQL source: bind the harness from the pinned plugin clone and verify ---
  # The org maintenance step only binds the harness from /opt/.devin/plugins/cache, which is empty for this
  # plugin in this org, so bind it from the pinned clone with the mongo+mysql extras (build-failing under `online`).
  /home/ubuntu/.venvs/recon/bin/python -m pip install -q -e "$HOME/repos/mongo-migration-plugin/skills/mongo-recon-harness/harness[mongo,mysql]"
  /home/ubuntu/.venvs/recon/bin/recon selftest
  # Post-setup checks: images, clients, pinned plugin, `recon selftest`, and `mongosh` connecting with the
  # org secret MONGODB_ATLAS_URI (roles listed read-only; never printed). MMP_RT_SRC_DSN is per-shell, not here.
  bash "$HOME/repos/ts-java-spring-boot-internet-banking/.devin/mmp-postsetup.sh"

knowledge:
  - name: java-version
    contents: |
      Requires JDK 21 (Temurin 21.0.2 installed at /usr/lib/jvm/jdk-21.0.2+13).
      Always `export JAVA_HOME=/usr/lib/jvm/jdk-21.0.2+13 && export PATH=$JAVA_HOME/bin:$PATH`
      before running Gradle; the box's default `java` is JDK 17 which will fail the build.
  - name: build
    contents: |
      Per-service: `cd <service-dir> && ./gradlew bootJar -x test --no-daemon`.
      Each service has its own Gradle wrapper (8.6); there is no aggregate root build.
  - name: run
    contents: |
      Full stack is containerized. After `maintenance` builds the javatodev/* images:
        cd docker-compose && docker compose up -d
      Brings up: zipkin(9411), keycloak(8080)+postgres, mysql(3306), config-server(8090),
      eureka registry(8081), api-gateway(8082), user(8083), fund-transfer(8084),
      utility-payment(8085), core-banking(8092). App containers self-order via wait-for-it.sh.
      Config is pulled at runtime from the public github config repo by the config-server.
  - name: verify
    contents: |
      Eureka UI: http://localhost:8081 (5 app services should be UP).
      Health: curl http://localhost:8090/actuator/health (and ports 8081-8085, 8092).
      Auth smoke test (Keycloak password grant -> gateway):
        TOKEN=$(curl -s -X POST http://localhost:8080/realms/javatodev-internet-banking/protocol/openid-connect/token \
          -d grant_type=password -d client_id=javatodev-internet-banking-api-client \
          -d client_secret=nVKeKJcoPbixsy2mxh9Yiy9azzGlA1V0 \
          -d username=ib_admin@javatodev.com -d password=5V7huE3G86uB | python3 -c 'import sys,json;print(json.load(sys.stdin)["access_token"])')
        curl -H "Authorization: Bearer $TOKEN" http://localhost:8082/banking-core/api/v1/user
      Note: the postman env's client_id (internet-banking-core-client) is stale; use
      javatodev-internet-banking-api-client from the keycloak realm-export instead.
  - name: mongo-migration-run
    contents: |
      Board UNT5 (MySQL 8 -> Atlas), run branch mmp-rt/b1-mysql; PR base is that branch, never main.
      Plugin: $HOME/repos/mongo-migration-plugin @ caeb34dc (0.7.0); read AGENTS.md + the ticket's SKILL.md; run its
      stdlib scripts directly; mongo_guard is advisory here, so export MONGO_GUARD_BASE_REF=origin/mmp-rt/b1-mysql
      and honour .migration/allowed_targets.json yourself (only database mmp_rt_b1_mysql, <10 MB, never drop).
      Harness: /home/ubuntu/.venvs/recon/bin/recon (installed with [mongo,mysql]); `recon selftest` must PASS.
      Source: local mysql:8 fixture rebuilt per session (recipe in .migration/fixtures/w1-b01.json); its DSN is the
      per-shell env var MMP_RT_SRC_DSN (JSON {"user","password","host","database"}, read-only user, never committed).
      Source query concurrency 1, session time_zone='+00:00'. Target secret MONGODB_ATLAS_URI by name only.
      Re-verify a VM with: bash .devin/mmp-postsetup.sh
      The dbx-migration-factory plugin's shell guard blocks commands whose cwd is this repo while .migration/ exists
      without allowed_targets.json: run from $HOME with absolute paths / `git -C` until UNT5-2 commits it.
