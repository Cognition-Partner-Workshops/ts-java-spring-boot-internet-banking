name: CD

# DEMO PIPELINE - every AWS identifier below is a MOCK placeholder.
# Nothing here can reach a real AWS account until the repository variables in
# docs/CICD.md are set to real values AND `AWS_MOCK_MODE` is set to `false`.
# While AWS_MOCK_MODE is `true` (the default), ECR pushes are skipped and all
# kubectl/helm calls run with `--dry-run=client`.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: Service to build and deploy
        required: true
        default: all
        type: choice
        options:
          - all
          - core-banking-service
          - internet-banking-api-gateway
          - internet-banking-config-server
          - internet-banking-fund-transfer-service
          - internet-banking-service-registry
          - internet-banking-user-service
          - internet-banking-utility-payment-service
      environment:
        description: Target environment (production still requires the staging run + approval gate)
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: temurin
  # Mock defaults; override with repository variables (Settings > Variables).
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID || '123456789012' }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY || '123456789012.dkr.ecr.us-east-1.amazonaws.com' }}
  ECR_REPOSITORY_PREFIX: ${{ vars.ECR_REPOSITORY_PREFIX || 'demo/internet-banking' }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'demo-eks' }}
  # 'true' (default) keeps this pipeline entirely side-effect free.
  AWS_MOCK_MODE: ${{ vars.AWS_MOCK_MODE || 'true' }}

jobs:
  plan:
    name: Resolve build matrix
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.plan.outputs.services }}
      image_tag: ${{ steps.plan.outputs.image_tag }}
    steps:
      - id: plan
        shell: bash
        run: |
          set -euo pipefail
          ALL=(core-banking-service \
               internet-banking-api-gateway \
               internet-banking-config-server \
               internet-banking-fund-transfer-service \
               internet-banking-service-registry \
               internet-banking-user-service \
               internet-banking-utility-payment-service)
          SEL='${{ github.event.inputs.service || 'all' }}'
          if [ "$SEL" = "all" ]; then
            SERVICES="$(printf '%s\n' "${ALL[@]}" | jq -cRn '[inputs | select(length > 0)]')"
          else
            SERVICES="$(jq -cn --arg s "$SEL" '[$s]')"
          fi
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"
          echo "image_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

  build-image:
    name: Image ${{ matrix.service }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # required for OIDC role assumption - no long-lived keys
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.plan.outputs.services) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      # The module Dockerfiles ADD build/libs/<service>-0.0.1-SNAPSHOT.jar,
      # so the jar must exist before the image build.
      - name: Build boot jar
        working-directory: ${{ matrix.service }}
        run: ./gradlew --no-daemon bootJar -x test

      - uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      # Real credentials only when the pipeline is taken out of mock mode.
      - name: Configure AWS credentials (OIDC)
        if: env.AWS_MOCK_MODE == 'false'
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN || 'arn:aws:iam::123456789012:role/demo-github-actions-deploy' }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-cd-${{ github.run_id }}

      - name: Log in to Amazon ECR
        if: env.AWS_MOCK_MODE == 'false'
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      # push=false under mock mode: the image is still built (so a broken
      # Dockerfile fails the pipeline) but never leaves the runner.
      - name: Build and push image
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991 # v6.13.0
        with:
          context: ${{ matrix.service }}
          file: ${{ matrix.service }}/Dockerfile
          push: ${{ env.AWS_MOCK_MODE == 'false' }}
          load: ${{ env.AWS_MOCK_MODE != 'false' }}
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_PREFIX }}/${{ matrix.service }}:${{ needs.plan.outputs.image_tag }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_PREFIX }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Mock-mode notice
        if: env.AWS_MOCK_MODE != 'false'
        run: |
          echo "AWS_MOCK_MODE=true - image built locally only, ECR push skipped."
          echo "Would have pushed: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_PREFIX }}/${{ matrix.service }}:${{ needs.plan.outputs.image_tag }}"

  deploy-staging:
    name: Deploy to staging
    needs: [plan, build-image]
    if: github.event_name == 'push' || github.event.inputs.environment == 'staging' || github.event.inputs.environment == 'production'
    runs-on: ubuntu-latest
    # GitHub Environment 'staging' - see docs/CICD.md for the protection rules.
    environment:
      name: staging
    permissions:
      contents: read
      id-token: write
    env:
      K8S_NAMESPACE: ${{ vars.EKS_NAMESPACE_STAGING || 'demo-staging' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: azure/setup-kubectl@3e0aec4d80787158d308d7b364cb1b702e7feb7f # v4.0.0
        with:
          version: v1.29.10

      - uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
        with:
          version: v3.16.3

      - name: Configure AWS credentials (OIDC)
        if: env.AWS_MOCK_MODE == 'false'
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN_STAGING || 'arn:aws:iam::123456789012:role/demo-github-actions-deploy-staging' }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-staging-${{ github.run_id }}

      - name: Update kubeconfig for EKS
        if: env.AWS_MOCK_MODE == 'false'
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      # Shared infra dependencies (Keycloak, MySQL/RDS, RabbitMQ/Amazon MQ, Zipkin).
      # Documented placeholder: in a real estate these are provisioned out-of-band
      # (Terraform) or as Helm releases; here the intent is only printed/dry-run.
      - name: Deploy shared infra dependencies (placeholder)
        run: bash .github/scripts/deploy.sh infra "$K8S_NAMESPACE"

      - name: Deploy services
        run: |
          set -euo pipefail
          for svc in $(jq -r '.[]' <<< '${{ needs.plan.outputs.services }}'); do
            IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY_PREFIX}/${svc}:${{ needs.plan.outputs.image_tag }}"
            bash .github/scripts/deploy.sh service "$K8S_NAMESPACE" "$svc" "$IMAGE"
          done

      - name: Smoke test (placeholder)
        run: |
          echo "Post-deploy smoke test target: https://staging.demo-internet-banking.invalid/actuator/health"
          echo "AWS_MOCK_MODE=${AWS_MOCK_MODE} - no live requests are made in mock mode."

  deploy-production:
    name: Deploy to production
    needs: [plan, build-image, deploy-staging]
    if: github.event_name == 'push' || github.event.inputs.environment == 'production'
    runs-on: ubuntu-latest
    # Manual approval gate: configure required reviewers on the 'production'
    # GitHub Environment. The job stays queued until a reviewer approves.
    environment:
      name: production
      url: https://demo-internet-banking.invalid
    permissions:
      contents: read
      id-token: write
    env:
      K8S_NAMESPACE: ${{ vars.EKS_NAMESPACE_PROD || 'demo-prod' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: azure/setup-kubectl@3e0aec4d80787158d308d7b364cb1b702e7feb7f # v4.0.0
        with:
          version: v1.29.10

      - uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
        with:
          version: v3.16.3

      - name: Configure AWS credentials (OIDC)
        if: env.AWS_MOCK_MODE == 'false'
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN_PROD || 'arn:aws:iam::123456789012:role/demo-github-actions-deploy-prod' }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-prod-${{ github.run_id }}

      - name: Update kubeconfig for EKS
        if: env.AWS_MOCK_MODE == 'false'
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      - name: Deploy shared infra dependencies (placeholder)
        run: bash .github/scripts/deploy.sh infra "$K8S_NAMESPACE"

      - name: Promote images to production
        run: |
          set -euo pipefail
          for svc in $(jq -r '.[]' <<< '${{ needs.plan.outputs.services }}'); do
            IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY_PREFIX}/${svc}:${{ needs.plan.outputs.image_tag }}"
            bash .github/scripts/deploy.sh service "$K8S_NAMESPACE" "$svc" "$IMAGE"
          done

      - name: Deployment summary
        run: |
          {
            echo "### Production deployment (${AWS_MOCK_MODE/true/MOCK})"
            echo ""
            echo "- cluster: \`${EKS_CLUSTER_NAME}\` namespace: \`${K8S_NAMESPACE}\`"
            echo "- image tag: \`${{ needs.plan.outputs.image_tag }}\`"
            echo "- services: \`${{ needs.plan.outputs.services }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
